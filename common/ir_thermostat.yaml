substitutions:
  follow_me_interval: "10s"  # override per-device if needed
  board: esp01_1m
  ir_tx_pin: GPIO4
  ir_rx_pin: GPIO5
  ir_rx_inverted: "true"
  github_ref: main
  external_components_source: github://ccma14/esphome-ir-thermostat@${github_ref}

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

external_components:
  - source: ${external_components_source}
    components: [ir_thermostat]

ir_thermostat:

esp8266:
  board: ${board}

# Enable logging
logger:
  level: DEBUG
  logs:
    remote.pronto: NONE  # Suppress all logs from remote.pronto
    component: ERROR     # Show only errors for generic component warnings

# Enable Home Assistant API
api:
  #encryption:
  #  key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  domain: !secret wifi_domain
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${name} Fallback Hotspot"
    password: !secret ap_password

captive_portal:
web_server:

remote_transmitter:
  - id: transmitter_ir
    pin: ${ir_tx_pin}
    carrier_duty_percent: 50%

remote_receiver:
  # see https://esphome.io/components/remote_transmitter.html#setting-up-infrared-devices
  # for details on discovering the correct codes for your devices
  - id: receiver_ir
    pin:
      number: ${ir_rx_pin}
      inverted: ${ir_rx_inverted}
    dump: all
    #dump: raw

number:
  - platform: template
    name: "Compensation Speedup"
    id: compensation_speedup
    min_value: -3
    max_value: 3
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 0

select:
  - platform: template
    name: "Room Size Profile"
    id: room_size_profile
    icon: "mdi:ruler-square"
    options:
      - "Small"
      - "Medium"
      - "Large"
    initial_option: "Medium"
    optimistic: true
    restore_value: true

sensor:
  - platform: template
    name: "K Filtered"
    id: follow_me_k_filtered
    unit_of_measurement: ""  # dimensionless gain
    accuracy_decimals: 2
    
  - platform: template
    name: "Adjusted Temperature"
    id: follow_me_adjusted_temp
    unit_of_measurement: "°F"
    accuracy_decimals: 2

  - platform: homeassistant
    name: "Thermostat"
    entity_id: ${temperature_sensor}
    id: ha_temperature_sensor
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    internal: True
    filters:
      - lambda: return f_to_c(x);  # Convert Fahrenheit to Celsius

button:
  - platform: template
    id: led_toggle
    name: "Mini-Split LED Toggle"
    on_press:
      - remote_transmitter.transmit_coolix:
          first: 0xB9F509
          second: 0xB9F509

switch:
  - platform: template
    id: follow_me
    name: "Follow Me"
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - logger.log: "Follow Me turned ON"
      - remote_transmitter.transmit_coolix:
          first: 0xB9F510
          second: 0xB9F510

      - lambda: id(follow_me).publish_state(true);
    turn_off_action:
      - logger.log: "Follow Me turned OFF"
      - lambda: id(follow_me).publish_state(false);
      - remote_transmitter.transmit_coolix:
          first: 0xB9F511
          second: 0xB9F511

climate:
  - platform: midea_ir
    id: thermostat_ir
    name: ${friendly_name}
    use_fahrenheit: true
    sensor: ha_temperature_sensor

# Protocol-specific transmission action. Override or replace this script to
# support other mini-split brands or transports (e.g., midea_ac.follow_me).
script:
  - id: send_follow_me_temp
    parameters:
      adjusted_temp_f: float
    then:
      - remote_transmitter.transmit_midea:
          code: !lambda |-
            return midea_follow_me_code(adjusted_temp_f);

interval:
  - interval: ${follow_me_interval}
    then:
      - if:
          condition:
            switch.is_on: follow_me
          then:
            - lambda: |-
                auto opt = id(room_size_profile).active_index();
                int room_size_idx = opt.has_value() ? opt.value() : 1;

                float out_k = 0.0f, out_adj = 0.0f;
                float adjusted_temp = get_compensated_temp(
                    id(ha_temperature_sensor).state, // Current temp. in Celsius
                    id(thermostat_ir).target_temperature, // Target temp. in Celsius
                    id(compensation_speedup).state, // Temp. correction speed
                    room_size_idx, // Room size profile selection
                    &out_k,
                    &out_adj
                );

                if (isnan(adjusted_temp)) {
                  ESP_LOGI("follow.me", "Sensors not ready — skipping IR transmission.");
                  return;
                }

                // Publish back to Home Assistant sensors
                id(follow_me_k_filtered).publish_state(out_k);
                id(follow_me_adjusted_temp).publish_state(out_adj);
                id(send_follow_me_temp).execute(adjusted_temp);

          else:
            - logger.log: "Follow Me is disabled; skipping IR transmission."
